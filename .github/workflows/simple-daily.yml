name: Simple Daily Sales Report

on:
  schedule:
    # 00:00 UTC = 09:00 KST 매일
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "특정 날짜 (YYYY-MM-DD KST). 비우면 어제."
        required: false
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: ./simple
        run: npm install

      - name: Run report
        working-directory: ./simple
        env:
          NAVER_STORES_JSON: ${{ secrets.NAVER_STORES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx run.ts ${{ inputs.date }}
