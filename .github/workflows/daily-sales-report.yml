name: Daily Sales Report (KST 08:00)

on:
  schedule:
    # 매 10분마다 — cron 엔드포인트가 워크스페이스별 reportTime 매칭으로 발송 결정
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_BASE_URL or CRON_SECRET secret not set"; exit 1
          fi
          curl --fail --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/daily-sales"
